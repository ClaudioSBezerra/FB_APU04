name: Deploy to Production (Coolify + AWS Bridge)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Build imagem combinada (Coolify) ──────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ── Build imagens separadas (API + Web) ───────────────────────────────────────
  build-installer-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ── Build imagem ERP Bridge ───────────────────────────────────────────────────
  build-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Bridge)
        id: meta-bridge
        uses: docker/metadata-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-bridge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Bridge image
        uses: docker/build-push-action@v5
        with:
          context: ./erp-bridge-aws
          file: ./erp-bridge-aws/Dockerfile
          push: true
          tags: ${{ steps.meta-bridge.outputs.tags }}
          labels: ${{ steps.meta-bridge.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ── Deploy fcxlabs (98.88.223.220) via self-hosted runner ───────────────────
  deploy-fcxlabs:
    needs: [build-installer-images]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cliente-aws]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Mesmo padrão do FB_APU02 (deploy-cliente-aws): o compose do repositório é a fonte
      # da verdade e sobrescreve o do servidor. Qualquer env var nova precisa ser commitada
      # em installer/fcxlabs/docker-compose.yml — edição manual no servidor é apagada aqui.
      # ATENÇÃO: o banco usa container cliente-db-simulador / volume postgres_data_simulador;
      # renomear isso no compose sobe o app com um banco VAZIO.
      - name: Sync docker-compose.yml para o deploy
        run: cp installer/fcxlabs/docker-compose.yml /opt/apps/fbtax/simu-apu04/docker-compose.yml

      - name: Deploy simu.fcxlabs.com
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          cd /opt/apps/fbtax/simu-apu04
          # ZAI_API_KEY: se o secret existir, vira a fonte da verdade (sobrescreve o
          # .env do servidor via interpolação do compose). Se vier vazio/ausente,
          # desfaz a var p/ o .env local continuar mandando — evita zerar a chave
          # (no docker compose, uma var de shell vazia tem precedência sobre o .env).
          if [ -z "${ZAI_API_KEY:-}" ]; then unset ZAI_API_KEY; fi
          docker compose pull
          docker compose up -d --force-recreate
          sleep 8
          if docker ps | grep fbtax-apu04-web; then
            echo "simu.fcxlabs.com OK."
            curl -f http://localhost:3007/api/health
          else
            echo "Deploy falhou."
            exit 1
          fi

  # ── Coolify (Hostinger) ────────────────────────────────────────────────────────
  # Mesmo modelo do FB_APU02: o Coolify faz o deploy sozinho, pelo webhook/Deploy Key
  # configurado na interface dele. O pipeline não chama mais a API do Coolify (porta 8000):
  # os runners do GitHub não alcançam essa porta (timeout em 24/11/2026) e o job quebrava
  # o pipeline inteiro, mesmo com o simu.fcxlabs.com deployado com sucesso.
  notify:
    needs: [build-and-push, build-installer-images, deploy-fcxlabs]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deploy Notification
        run: |
          echo "Build concluído!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch/Tag: ${{ github.ref_name }}"
          echo "Data: $(date)"
          echo "simu.fcxlabs.com: ${{ needs.deploy-fcxlabs.result }}"
          echo "Coolify (Hostinger) faz deploy automático via webhook configurado na interface."
