services:
  # Backend (Go)
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fb_apu04-api
    restart: always
    ports:
      - "8084:8084"
    expose:
      - "8084"
    environment:
      - PORT=8084
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL:-https://simulador.fbtax.cloud}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - APP_MODULE=${APP_MODULE:-}
      - ALLOWED_DESTRUCTIVE_DBS=${ALLOWED_DESTRUCTIVE_DBS:-fiscal_apu04_db}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - api_uploads:/root/uploads
      - api_backups:/backups
    networks:
      fb_net:
        aliases:
          - apu04-api

  # Frontend (React) — label Traefik restrito a simu.fcxlabs.com (22/10):
  # domínio administrado pela equipe de Segurança da Ferreira Costa (AWS),
  # fora do nosso controle — continua exposto direto até eles migrarem pro
  # Cloudflare. simulador.fbtax.cloud (nosso domínio) saiu daqui porque já
  # está 100% no Cloudflare Tunnel desde 21/10.
  web:
    build:
      context: ./frontend
      args:
        - VITE_APP_MODULE=${VITE_APP_MODULE:-}
    container_name: fb_apu04-web
    restart: always
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.simu.rule=Host(`simu.fcxlabs.com`)"
      - "traefik.http.routers.simu.entrypoints=https"
      - "traefik.http.routers.simu.tls=true"
      - "traefik.http.routers.simu.tls.certresolver=letsencrypt"
      - "traefik.http.services.simu.loadbalancer.server.port=80"
    depends_on:
      - api
    networks:
      - fb_net
      - coolify

  # Banco de Dados
  db:
    image: postgres:15-alpine
    container_name: fb_apu04-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data_apu04:/var/lib/postgresql/data
    networks:
      - fb_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis
  redis:
    image: redis:alpine
    container_name: fb_apu04-redis
    restart: always
    sysctls:
      - net.core.somaxconn=1024
    networks:
      - fb_net

  # Cloudflare Tunnel (21/10, ativado e validado em 22/10) — caminho público
  # pra simulador.fbtax.cloud (rota no painel: hostname raiz -> http://web:80).
  # Confirmado neste app que docker-compose.yml (este arquivo) é o real —
  # docker-compose.prod.yml não tem label de `web` nenhum. simu.fcxlabs.com
  # continua fora, via Traefik (ver comentário em `web` acima).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fb_apu04-cloudflared-prod
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - fb_net
    depends_on:
      - web

networks:
  fb_net:
    driver: bridge
  coolify:
    external: true

volumes:
  postgres_data_apu04:
  api_uploads:
  api_backups:
