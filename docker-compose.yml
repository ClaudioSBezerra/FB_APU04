services:
  # Backend (Go)
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fb_apu04-api
    restart: always
    ports:
      - "8084:8084"
    expose:
      - "8084"
    environment:
      - PORT=8084
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL:-https://simulador.fbtax.cloud}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - APP_MODULE=${APP_MODULE:-}
      - ALLOWED_DESTRUCTIVE_DBS=${ALLOWED_DESTRUCTIVE_DBS:-fiscal_apu04_db}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - api_uploads:/root/uploads
      - api_backups:/backups
    networks:
      fb_net:
        aliases:
          - apu04-api

  # Frontend (React)
  web:
    build:
      context: ./frontend
      args:
        - VITE_APP_MODULE=${VITE_APP_MODULE:-}
    container_name: fb_apu04-web
    restart: always
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.simu.rule=Host(`simu.fcxlabs.com`) || Host(`simulador.fbtax.cloud`)"
      - "traefik.http.routers.simu.entrypoints=https"
      - "traefik.http.routers.simu.tls=true"
      - "traefik.http.routers.simu.tls.certresolver=letsencrypt"
      - "traefik.http.services.simu.loadbalancer.server.port=80"
    depends_on:
      - api
    networks:
      - fb_net
      - coolify

  # Banco de Dados
  db:
    image: postgres:15-alpine
    container_name: fb_apu04-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data_apu04:/var/lib/postgresql/data
    networks:
      - fb_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis
  redis:
    image: redis:alpine
    container_name: fb_apu04-redis
    restart: always
    sysctls:
      - net.core.somaxconn=1024
    networks:
      - fb_net

  # ── Observabilidade (OBS-01) ─────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: fb_apu04-prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    expose:
      - "9090"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus:/etc/prometheus:ro
    networks:
      - fb_net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: fb_apu04-grafana
    restart: always
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - fb_net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: fb_apu04-alertmanager
    restart: always
    # Entrypoint usa awk para expandir ${SMTP_*} no template antes de iniciar.
    # O Alertmanager v0.27 não expande env vars no YAML por padrão — arquivo .tpl
    # é processado em runtime via awk, gerando /tmp/alertmanager.yml com valores reais.
    # Nota: envsubst não está disponível na imagem prom/alertmanager (sem apk/apt);
    # awk é parte do Busybox e disponível nesta imagem. & e \ são escapados antes de
    # serem usados como replacement em gsub para evitar corrupção de senhas com esses chars.
    entrypoint:
      - /bin/sh
      - -c
      - |
        awk 'BEGIN{
          h=ENVIRON["SMTP_HOST"];  gsub(/\\/,"\\\\",h);  gsub(/&/,"\\&",h)
          p=ENVIRON["SMTP_PORT"];  gsub(/\\/,"\\\\",p);  gsub(/&/,"\\&",p)
          u=ENVIRON["SMTP_USER"];  gsub(/\\/,"\\\\",u);  gsub(/&/,"\\&",u)
          pw=ENVIRON["SMTP_PASSWORD"]; gsub(/\\/,"\\\\",pw); gsub(/&/,"\\&",pw)
          f=ENVIRON["SMTP_FROM"];  gsub(/\\/,"\\\\",f);  gsub(/&/,"\\&",f)
        }{
          gsub(/\$\{SMTP_HOST\}/,h)
          gsub(/\$\{SMTP_PORT\}/,p)
          gsub(/\$\{SMTP_USER\}/,u)
          gsub(/\$\{SMTP_PASSWORD\}/,pw)
          gsub(/\$\{SMTP_FROM\}/,f)
          print
        }' /etc/alertmanager/alertmanager.yml.tpl > /tmp/alertmanager.yml &&
        /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    expose:
      - "9093"
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    volumes:
      - alertmanager_data:/alertmanager
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    networks:
      - fb_net

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: fb_apu04-postgres-exporter
    restart: always
    expose:
      - "9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    networks:
      - fb_net
    depends_on:
      - db

  # Cloudflare Tunnel (21/10, migração de segurança) — scaffold DORMENTE,
  # também presente em docker-compose.prod.yml (não ficou claro ainda qual
  # dos dois arquivos o Coolify usa de verdade pra este app — ver achado no
  # FB_FAROL/FB_APU02, onde só docker-compose.yml era real — por segurança,
  # duplicado nos dois aqui; inofensivo, só um vale). Sem
  # CLOUDFLARE_TUNNEL_TOKEN setado no Coolify, este container só reinicia
  # sozinho, sem afetar os demais.
  #
  # Passo a passo (manual, painel Cloudflare):
  #   1. Zero Trust -> Networks -> Tunnels -> Create a tunnel, nome ex.
  #      "fb-apu04-prod".
  #   2. Copiar o token gerado e setar CLOUDFLARE_TUNNEL_TOKEN no Coolify.
  #   3. Public Hostname/Route: Subdomain=simulador, Domain=fbtax.cloud,
  #      Service=http://web:80.
  #   4. Apagar o registro DNS A antigo de simulador.fbtax.cloud ANTES de
  #      criar a rota (senão o Cloudflare não cria o CNAME do túnel sozinho
  #      — erro 1016 "Origin DNS error" se isso já tiver acontecido; aí só
  #      criar o CNAME manual pra <tunnel-id>.cfargotunnel.com).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fb_apu04-cloudflared-prod
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - fb_net
    depends_on:
      - web

networks:
  fb_net:
    driver: bridge
  coolify:
    external: true

volumes:
  postgres_data_apu04:
  api_uploads:
  api_backups:
  prometheus_data:
  grafana_data:
  alertmanager_data:
