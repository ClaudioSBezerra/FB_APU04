services:
  api:
    image: ghcr.io/claudiosbezerra/fb_apu04-api:latest
    container_name: fbtax-apu04-api
    restart: always
    expose:
      - "8084"
    environment:
      - PORT=8084
      # Usa o banco do APU02 (cliente-db na rede cliente_net)
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@cliente-db:5432/${DB_NAME}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL:-https://simu.fcxlabs.com}
      - APP_MODULE=simulador
      - COOKIE_SECURE=true
    depends_on:
      redis:
        condition: service_started
    volumes:
      - api_uploads:/root/uploads
    networks:
      - cliente_net   # rede do APU02 — acesso ao banco compartilhado
      - fbtax_net     # rede interna para comunicação com web e redis

  web:
    image: ghcr.io/claudiosbezerra/fb_apu04-web:latest
    container_name: fbtax-apu04-web
    restart: always
    ports:
      - "${WEB_PORT:-3007}:80"
    depends_on:
      - api
    networks:
      - fbtax_net

  redis:
    image: redis:7-alpine
    container_name: fbtax-apu04-redis
    restart: always
    networks:
      - fbtax_net
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru

networks:
  fbtax_net:
    driver: bridge
  cliente_net:
    name: cliente-aws_cliente_net
    external: true

volumes:
  api_uploads:
    driver: local
