services:
  api:
    image: ghcr.io/claudiosbezerra/fb_apu04-api:latest
    container_name: fbtax-apu04-api
    restart: always
    expose:
      - "8084"
    environment:
      - PORT=8084
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL:-https://simu.fcxlabs.com}
      - APP_MODULE=simulador
      - COOKIE_SECURE=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - api_uploads:/root/uploads
    networks:
      - fbtax_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    image: ghcr.io/claudiosbezerra/fb_apu04-web:latest
    container_name: fbtax-apu04-web
    restart: always
    ports:
      - "${WEB_PORT:-3007}:80"
    depends_on:
      - api
    networks:
      - fbtax_net

  db:
    image: postgres:15-alpine
    container_name: fbtax-apu04-db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fbtax_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: fbtax-apu04-redis
    restart: always
    networks:
      - fbtax_net
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru

networks:
  fbtax_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_uploads:
    driver: local
