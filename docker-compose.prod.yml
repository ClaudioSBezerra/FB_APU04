services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: fb_apu04-api-prod
    restart: always
    ports:
      - "8084:8084"
    expose:
      - "8084"
    environment:
      - PORT=8084
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=require
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=true
      - APP_MODULE=simulador
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL:-https://simu.fbtax.cloud}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - ALLOWED_DESTRUCTIVE_DBS=${ALLOWED_DESTRUCTIVE_DBS:-fiscal_apu04_db}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - api_uploads:/root/uploads
      - api_backups:/backups
    networks:
      - fb_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./frontend
      args:
        - VITE_APP_MODULE=simu
    container_name: fb_apu04-web-prod
    restart: always
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.simu.rule=Host(`simu.fbtax.cloud`) || Host(`simu.fcxlabs.com`)"
      - "traefik.http.routers.simu.entrypoints=https"
      - "traefik.http.routers.simu.tls=true"
      - "traefik.http.routers.simu.tls.certresolver=letsencrypt"
      - "traefik.http.services.simu.loadbalancer.server.port=80"
    depends_on:
      - api
    networks:
      - fb_net
      - coolify

  db:
    image: postgres:15-alpine
    container_name: fb_apu04-db-prod
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - fb_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: fb_apu04-redis-prod
    restart: always
    sysctls:
      - net.core.somaxconn=1024
    volumes:
      - redis_data:/data
    networks:
      - fb_net
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes

  # ── Observabilidade (OBS-01) ─────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: fb_apu04-prometheus-prod
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    expose:
      - "9090"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus:/etc/prometheus:ro
    networks:
      - fb_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:11.3.0
    container_name: fb_apu04-grafana-prod
    restart: always
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST:-grafana.fcxlabs.com}`)"
      - "traefik.http.routers.grafana.entrypoints=https"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - fb_net
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: fb_apu04-alertmanager-prod
    restart: always
    # Entrypoint usa sed para expandir ${SMTP_*} no template antes de iniciar.
    # O Alertmanager v0.27 não expande env vars no YAML por padrão — arquivo .tpl
    # é processado em runtime via sed, gerando /tmp/alertmanager.yml com valores reais.
    # Nota: envsubst não está disponível na imagem prom/alertmanager (sem apk/apt);
    # sed é parte do Busybox e funciona nesta imagem Alpine-based.
    entrypoint:
      - /bin/sh
      - -c
      - |
        awk 'BEGIN{h=ENVIRON["SMTP_HOST"];p=ENVIRON["SMTP_PORT"];u=ENVIRON["SMTP_USER"];pw=ENVIRON["SMTP_PASSWORD"];f=ENVIRON["SMTP_FROM"]}{gsub(/\$\{SMTP_HOST\}/,h);gsub(/\$\{SMTP_PORT\}/,p);gsub(/\$\{SMTP_USER\}/,u);gsub(/\$\{SMTP_PASSWORD\}/,pw);gsub(/\$\{SMTP_FROM\}/,f);print}' /etc/alertmanager/alertmanager.yml.tpl > /tmp/alertmanager.yml && /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    expose:
      - "9093"
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    volumes:
      - alertmanager_data:/alertmanager
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    networks:
      - fb_net

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: fb_apu04-postgres-exporter-prod
    restart: always
    expose:
      - "9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    networks:
      - fb_net
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  fb_net:
    driver: bridge
  coolify:
    external: true

volumes:
  postgres_data_prod:
    driver: local
  redis_data:
    driver: local
  api_uploads:
    driver: local
  api_backups:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
