services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: fb_apu04-api-prod
    restart: always
    ports:
      - "8084:8084"
    expose:
      - "8084"
    environment:
      - PORT=8084
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=require
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=true
      - APP_MODULE=simulador
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL:-https://simu.fbtax.cloud}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - api_uploads:/root/uploads
    networks:
      - fb_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./frontend
      args:
        - VITE_APP_MODULE=simu
    container_name: fb_apu04-web-prod
    restart: always
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.simu.rule=Host(`simu.fbtax.cloud`) || Host(`simu.fcxlabs.com`)"
      - "traefik.http.routers.simu.entrypoints=https"
      - "traefik.http.routers.simu.tls=true"
      - "traefik.http.routers.simu.tls.certresolver=letsencrypt"
      - "traefik.http.services.simu.loadbalancer.server.port=80"
    depends_on:
      - api
    networks:
      - fb_net
      - coolify

  db:
    image: postgres:15-alpine
    container_name: fb_apu04-db-prod
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - fb_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: fb_apu04-redis-prod
    restart: always
    sysctls:
      - net.core.somaxconn=1024
    volumes:
      - redis_data:/data
    networks:
      - fb_net
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes

networks:
  fb_net:
    driver: bridge
  coolify:
    external: true

volumes:
  postgres_data_prod:
    driver: local
  redis_data:
    driver: local
  api_uploads:
    driver: local
