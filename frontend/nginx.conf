upstream backend {
    server api:8084;
}

server {
    listen 80;
    client_max_body_size 2048M;

    # index.html nunca cacheado — garante que deploys novos sejam carregados imediatamente
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # STAB-10: cleanup script must always be fresh — never cached by browser/proxy
    location = /unregister-sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        types { } default_type application/javascript;
    }

    # Assets Vite têm hash no nome (ex: index.BxA3k2m1.js) — cache longo é seguro
    location ~* ^/assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Aumentar timeouts para evitar 504 em processamentos longos ou inicialização lenta
        proxy_connect_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;

        # OTIMIZAÇÃO CRÍTICA PARA UPLOAD DE ARQUIVOS GRANDES:
        proxy_request_buffering off;
        proxy_http_version 1.1;
        client_body_timeout 1200s;
    }
}